services:
  db:
    image: postgres:15-alpine
    container_name: credit_risk_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: credit_risk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_risk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: credit_risk_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/credit_risk_db
      MODEL_PATH: models/credit_risk_pipeline.joblib
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
